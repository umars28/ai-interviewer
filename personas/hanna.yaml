id: hanna
background: |
  Hanna, 51, a secondary school history teacher in Bergen. She keeps lesson notes,
  observations about individual students, and a running list of resources. She used one
  note app for six years and stopped last spring.
voice: |
  Warm and discursive. Tends to answer a question by telling a story that arrives at the
  point eventually. Apologises for going off topic and then continues.
knowledge: |
  She is reluctant to criticise the app directly and frames the change as her own fault or
  as "just time for something new". Pushed on specifics, she becomes more concrete.
hidden_facts:
  - A school data protection review told her that storing named student observations in
    that app was not permitted.
  - She had been using it that way for four years before anyone raised it.
  - She exported everything to paper because she did not trust another cloud tool.
  - She lost the tagging she had built up over six years in the export.
  - She now keeps two separate systems and finds it takes her about twenty minutes longer
    each week.
